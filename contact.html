<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Contact Me</title>
</head>
<body>
    <header>
        <h1>Contact Me</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
        <hr>
    </header>
    <main>
        <h2>Let's Get in Touch</h2>
        <p>Fill out the form below to send me a message.</p>
        <form action="#" method="get">

            <div>
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>

            <div>
                <label for="emailAddress">Email Address:</label>
                <input type="email" id="emailAddress" name="emailAddress" required>
            </div>

            <div>
                <label for="inquiryType">Reason for Inquiry:</label>
                <select id="inquiryType" name="inquiryType">
                    <option value="general">General Question</option>
                    <option value="collaboration">Project Collaboration</option>
                    <option value="feedback">Website Feedback</option>
                </select>
            </div>

            <fieldset>
                <legend>Are you a fellow student or recruiter?</legend>

                <input type="radio" id="roleStudent" name="userRole" value="student">
                <label for="roleStudent">Student</label>

                <input type="radio" id="roleRecruiter" name="userRole" value="recruiter">
                <label for="roleRecruiter">Recruiter/Industry Professional</label>

                <input type="radio" id="roleOther" name="userRole" value="other" checked>
                <label for="roleOther">Other</label>
            </fieldset>

            <div>
                <input type="checkbox" id="sendCopy" name="sendCopy" value="yes">
                <label for="sendCopy">Send a copy of this message to my email</label>
            </div>

            <div>
                <label for="userMessage">Message:</label>
                <textarea id="userMessage" name="userMessage" rows="5" required></textarea>
            </div>

            <div>
                <button type="submit">Submit Message</button>
            </div>
        </form>

    </main>
    <footer>
        <hr>
        <p>&copy; 2026 Mikyle Holt</p>
    </footer>

</body>
</html>
